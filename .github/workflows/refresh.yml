name: Refresh official park data
on:
  workflow_dispatch:
  # Enable a weekly schedule after credentials and deployment are verified.
  # schedule:
  #   - cron: '17 20 * * 0'
permissions:
  contents: write
concurrency:
  group: official-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure private API credential
        env:
          API_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          test -n "$API_KEY"
          test -n "$KOSIS_KEY"
          printf 'DATA_GO_KR_SERVICE_KEY=%s\n' "$API_KEY" > .env.local
          printf 'KOSIS_API_KEY=%s\n' "$KOSIS_KEY" >> .env.local
      - name: Collect complete API snapshots
        run: |
          node collect-data.mjs
          node collect-kosis.mjs
      - name: Build and validate static data
        run: |
          node build-data.mjs
          node --test tests/*.test.mjs
      - name: Commit changed public data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data site/lib.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified official park data"
            git push
          fi
